name: Deploy to Railway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@10.4.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      # O deploy é feito pela integração GitHub da Railway ("Wait for CI": sobe o commit quando este build passa).
      # O antigo aviso por API (serviceInstanceRedeploy) respondia "Not Authorized" e, quando funcionava,
      # refazia o deploy ATIVO (a versão anterior), não o commit novo — por isso foi retirado.
      - name: Commit liberado para a Railway
        run: echo "✅ Build ok — a Railway sobe ${{ github.sha }} pela integração com o GitHub (Wait for CI)"

<!doctype html>
<html lang="pt-BR" translate="no">

  <head>
    <meta charset="UTF-8" />
    <!-- O site já é em português: a tradução automática do Chrome reescreve o DOM e quebra o React (erro removeChild/insertBefore) -->
    <meta name="google" content="notranslate" />
    <!-- Google Search Console (propriedade https://romateccrm.com) -->
    <meta name="google-site-verification" content="kzoeHBZVlxfxBJxr5EEvWTveRKdn01BnLgyObTXIRfs" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Romatec CRM</title>

    <!-- PWA (identidade visual v1.0: ícone R dourado em squircle verde, fundo preto) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Romatec CRM — Gestão de Leads Imobiliários · Romatec Consultoria Total, Açailândia/MA" />

    <!-- iOS PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Romatec CRM" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />

    <!-- Fontes da marca: Cinzel (títulos), Manrope (texto), JetBrains Mono (números/versão) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Sem bloquear a primeira pintura (Core Web Vitals): carrega como "print" e troca para "all" ao terminar -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" /></noscript>
    <!-- Fundo preto antes do JS carregar (evita flash branco) -->
    <style>html,body{background:#000;margin:0}</style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>

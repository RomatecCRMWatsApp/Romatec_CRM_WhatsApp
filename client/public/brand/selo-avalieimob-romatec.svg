  <text font-family="Inter Display, Inter, sans-serif" font-weight="700" font-size="36" letter-spacing="10" fill="#C9A84C"><textPath href="#arcoBase" startOffset="50%" text-anchor="middle">ROMATEC CRM</textPath></text>
  <circle cx="168" cy="600" r="9" fill="#C9A84C"/><circle cx="832" cy="600" r="9" fill="#C9A84C"/>
  <g transform="translate(500 512) scale(0.74) translate(-520 -505)" filter="url(#sombra)" fill="none" stroke="url(#ouro)" stroke-linejoin="miter" stroke-linecap="butt">
    <!-- A (AvalieImob) e haste do R (Romatec) num traço só: o topo é o pico do telhado -->
    <path d="M286 742 L520 250 L520 742" stroke-width="58"/>
    <!-- bojo do R; a linha de baixo continua para a esquerda e vira a travessa do A -->

  <circle cx="500" cy="500" r="455" fill="none" stroke="#C9A84C" stroke-width="5"/>
  <circle cx="500" cy="500" r="438" fill="none" stroke="#C9A84C" stroke-width="1.6" opacity=".8"/>
  <circle cx="500" cy="500" r="268" fill="none" stroke="#C9A84C" stroke-width="2" opacity=".55"/>
  
  <path id="arcoTopo" d="M 150 500 A 350 350 0 0 1 850 500" fill="none"/>
  <path id="arcoBase" d="M 178 560 A 325 325 0 0 0 822 560" fill="none"/>

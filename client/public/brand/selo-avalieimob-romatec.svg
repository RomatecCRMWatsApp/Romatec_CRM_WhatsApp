    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBE7A1"/><stop offset=".45" stop-color="#E2BC5A"/><stop offset=".75" stop-color="#C9A84C"/><stop offset="1" stop-color="#9C7A2C"/></linearGradient>
